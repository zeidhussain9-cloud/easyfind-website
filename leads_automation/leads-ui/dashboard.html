<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>EasyFind Leads Dashboard</title>
<style>
:root{font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#142337;background:#f3f6fa}*{box-sizing:border-box}body{margin:0}header{background:#12345a;color:white;padding:22px max(20px,calc((100vw - 1200px)/2))}header h1{margin:0;font-size:23px}header p{margin:6px 0 0;color:#c5d8ed}.wrap{max-width:1200px;margin:auto;padding:24px 18px}.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-bottom:20px}.stat,.panel{background:white;border:1px solid #e2e8f0;border-radius:12px;padding:18px;box-shadow:0 2px 8px #12345a08}.stat span{font-size:13px;color:#53677f}.stat strong{display:block;font-size:30px;margin-top:6px}.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:15px}input,select,button{font:inherit;border:1px solid #cbd5e1;border-radius:8px;padding:11px;background:white}input{flex:1;min-width:180px}button{background:#1764aa;color:white;border:0;cursor:pointer}button:hover{background:#104e88}.message{margin:12px 0;color:#53677f}.error{color:#a12b2b}.tablewrap{overflow:auto}table{border-collapse:collapse;width:100%;font-size:13px}th,td{text-align:left;padding:12px;border-bottom:1px solid #e8edf4;vertical-align:top}th{background:#f7f9fc;color:#445a72;position:sticky;top:0;white-space:nowrap}td{max-width:260px;overflow-wrap:anywhere}tr:hover td{background:#f8fbff}.pill{display:inline-block;background:#eaf2fc;color:#14518a;padding:4px 9px;border-radius:20px;font-size:12px}.details{border:1px solid #dce5ef;border-radius:9px;padding:12px;margin:8px 0}.details summary{cursor:pointer;font-weight:600}.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-top:14px}.fields div{overflow-wrap:anywhere}.fields small{display:block;color:#64748b;margin-bottom:3px}.wa{display:inline-block;background:#e3f7e9;color:#17683a;padding:7px 11px;border-radius:7px;font-weight:650;text-decoration:none;margin-top:5px}.wa:hover{background:#c8edcf}.source{font-size:12px;color:#53677f}.mobile{display:none}@media(max-width:700px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.wrap{padding:15px 12px}.desktop{display:none}.mobile{display:block}.stat strong{font-size:24px}header{padding:20px 15px}}
</style></head><body><header><h1>EasyFind Leads Dashboard</h1><p>Lead tracker · Google Sheets</p></header><main class="wrap"><section class="stats"><div class="stat"><span>Total leads</span><strong id="total">—</strong></div><div class="stat"><span>Matching leads</span><strong id="matching">—</strong></div><div class="stat"><span>WhatsApp sources</span><strong id="sourcesCount">—</strong></div></section><section class="panel"><div class="toolbar"><input id="search" type="search" placeholder="Search leads, location, requirements…" aria-label="Search leads"><select id="source" aria-label="Filter WhatsApp source"><option value="">All WhatsApp numbers</option></select><select id="status" aria-label="Filter lead status"><option value="">All statuses</option></select><button id="refresh">Refresh</button></div><div class="message" id="message" role="status">Loading leads…</div><div class="tablewrap desktop"><table><thead><tr><th>Customer</th><th>Phone / WhatsApp</th><th>Imported from</th><th>Status</th><th>Location</th><th>Requirement</th><th>Priority</th><th>Last interaction</th></tr></thead><tbody id="rows"></tbody></table></div><div class="mobile" id="cards"></div></section></main>
<script>
"use strict";let all=[];const $=id=>document.getElementById(id);const fields=["Customer Name","Phone Number","Extracted From Phone","Lead Status","Preferred Location","Current Requirement","Priority","Last Interaction Date"];const cell=(row,key)=>String(row[key]??"");const safe=(value)=>{const d=document.createElement("div");d.textContent=String(value??"");return d.innerHTML};function waLink(r){const number=cell(r,"Phone Number").replace(/[^0-9]/g,"");return number.length>=10&&number.length<=15?'<a class="wa" target="_blank" rel="noopener noreferrer" href="https://wa.me/'+number+'">Open WhatsApp ↗</a>':""}function render(){const term=$("search").value.trim().toLowerCase(),status=$("status").value,source=$("source").value;const filtered=all.filter(r=>(!status||cell(r,"Lead Status")===status)&&(!source||cell(r,"Extracted From Phone")===source)&&(!term||Object.values(r).some(v=>String(v??"").toLowerCase().includes(term))));$("matching").textContent=filtered.length;$("message").textContent=filtered.length?"Showing "+filtered.length+" lead(s)":"No matching leads";$("rows").innerHTML=filtered.map(r=>"<tr>"+fields.map((f,i)=>"<td>"+(i===1?safe(cell(r,f))+"<br>"+waLink(r):i===3?'<span class="pill">'+safe(cell(r,f))+"</span>":safe(cell(r,f)))+"</td>").join("")+"</tr>").join("");$("cards").innerHTML=filtered.map(r=>'<details class="details"><summary>'+safe(cell(r,"Customer Name")||cell(r,"Phone Number")||"Lead")+' · '+safe(cell(r,"Lead Status"))+'<br><span class="source">Source: '+safe(cell(r,"Extracted From Phone")||"Not recorded")+'</span></summary>'+waLink(r)+'<div class="fields">'+Object.entries(r).filter(([k,v])=>v!==""&&v!=null).map(([k,v])=>"<div><small>"+safe(k)+"</small>"+safe(v)+"</div>").join("")+"</div></details>").join("")}async function load(){const b=$("refresh");b.disabled=true;$("message").className="message";$("message").textContent="Loading leads…";try{const response=await fetch("/api/leads",{cache:"no-store"});const json=await response.json();if(!response.ok||!json.success||!Array.isArray(json.data))throw Error(json.message||json.error||"Unexpected API response");all=json.data;$("total").textContent=all.length;const sources=[...new Set(all.map(r=>cell(r,"Extracted From Phone")).filter(Boolean))].sort();$("sourcesCount").textContent=sources.length;const oldSource=$("source").value;$("source").innerHTML='<option value="">All WhatsApp numbers</option>'+sources.map(n=>'<option value="'+safe(n)+'">'+safe(n)+' ('+all.filter(r=>cell(r,"Extracted From Phone")===n).length+')</option>').join("");$("source").value=sources.includes(oldSource)?oldSource:"";const previous=$("status").value;const statuses=[...new Set(all.map(r=>cell(r,"Lead Status")).filter(Boolean))].sort();$("status").innerHTML='<option value="">All statuses</option>'+statuses.map(s=>'<option value="'+safe(s)+'">'+safe(s)+"</option>").join("");$("status").value=statuses.includes(previous)?previous:"";render()}catch(e){$("message").className="message error";$("message").textContent="Unable to load leads: "+e.message;$("total").textContent="—";$("matching").textContent="—"}finally{b.disabled=false}}$("search").addEventListener("input",render);$("status").addEventListener("change",render);$("source").addEventListener("change",render);$("refresh").addEventListener("click",load);load();
</script></body></html>
